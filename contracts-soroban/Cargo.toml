[workspace]
resolver = "2"
members = [
  "mimir-market",
  "mimir-squad",
]

[workspace.package]
# The oldest rustc these contracts are tested with: soroban-sdk 25.3.2's own
# rust-version. The release toolchain is pinned separately in the repo-root
# rust-toolchain.toml; see docs/CONTRACT_TOOLCHAINS.md.
rust-version = "1.91"

[workspace.dependencies]
soroban-sdk = "25.3.2"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
