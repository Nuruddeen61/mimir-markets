[package]
name = "mimir-market"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
publish = false
description = "Mimir oracle-settled prediction market (Soroban port of contracts/MimirV2.sol)"

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
